services:
  postgres:
    image: postgres:16-alpine
    container_name: s3-training-postgres
    environment:
      POSTGRES_USER: training
      POSTGRES_PASSWORD: training
      POSTGRES_DB: s3_training
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d s3_training"]
      interval: 5s
      timeout: 3s
      retries: 10
  mongodb:
    image: mongo:7
    container_name: s3-training-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  postgres-data:
  mongo-data:
