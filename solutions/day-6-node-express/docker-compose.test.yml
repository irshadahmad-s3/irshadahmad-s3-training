services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow_test
      POSTGRES_PASSWORD: taskflow_test_only
      POSTGRES_DB: taskflow_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - taskflow-test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_test -d taskflow_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  mongodb-test:
    image: mongo:7
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - taskflow-test-mongo:/data/db
volumes:
  taskflow-test-postgres:
  taskflow-test-mongo:
